<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha de Palitos - Design Original</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0714;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;outline:none}
button, input, a { outline: none !important; }

#tvInput {
  position: absolute;
  top: -100px;
  left: -100px;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.health-top{width:100%;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,14,35,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(241,196,15,.2);height:40px;z-index:10;flex-shrink:0}
.player-box{display:flex;align-items:center;gap:8px;flex:1}
.player-box.right{flex-direction:row-reverse}
.player-label{color:#fff;font-weight:800;font-size:11px;letter-spacing:1px}
.health-bar{width:110px;height:12px;background:#0a0812;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.health-fill{height:100%;transition:width.4s ease;border-radius:10px}
.green-fill{background:linear-gradient(90deg,#00ff88,#2ecc71)}
.red-fill{background:linear-gradient(90deg,#ff4757,#e74c3c)}
.center-info{text-align:center}
.vs-text{color:#f1c40f;font-weight:900;font-size:12px}

.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;width:100%}
canvas{width:100%;height:100%;display:block}

.controls{width:100%;padding:8px 12px;background:rgba(18,13,32,.98);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:10px;height:65px;flex-shrink:0}
.pad-group{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);padding:6px 10px;border-radius:10px}
.pad-label{color:#aaa;font-size:10px;font-weight:800;margin-right:4px}
.btn-game{background:linear-gradient(180deg,#3a2d5e,#2b1f47);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer}
.btn-fire-direct{width:80px;height:45px;background:linear-gradient(180deg,#ffd32a,#ff6b00);color:#000;font-weight:900;border:none;border-radius:10px;box-shadow:0 0 10px rgba(255,107,0,.4);font-size:11px;line-height:1.1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
#powerText{font-size:10px;font-weight:900;margin-top:2px}
</style>
</head>
<body id="gameBody" oncontextmenu="return false;">

<input type="text" id="tvInput" readonly>

<div class="health-top">
  <div class="player-box"><span class="player-label">🟢 VOCÊ</span><div class="health-bar"><div id="healthGreen" class="health-fill green-fill" style="width:100%"></div></div></div>
  <div class="center-info"><div class="vs-text">⚔️️ BATALHA DE PALITOS</div></div>
  <div class="player-box right"><span class="player-label">🤖 INIMIGO</span><div class="health-bar"><div id="healthRed" class="health-fill red-fill" style="width:100%"></div></div></div>
</div>

<div class="canvas-container" id="canvasContainer">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="controls">
  <div class="pad-group">
    <span class="pad-label">MOVER:</span>
    <button class="btn-game" tabindex="-1">◀</button>
    <button class="btn-game" tabindex="-1">▶</button>
  </div>
  <div class="pad-group">
    <span class="pad-label">MIRA:</span>
    <button class="btn-game" tabindex="-1">▲</button>
    <button class="btn-game" tabindex="-1">▼</button>
  </div>
  <div class="pad-group">
    <button class="btn-fire-direct" tabindex="-1">🔥 ATIRAR<br><span id="powerText">40%</span></button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const container = document.getElementById('canvasContainer');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1, logicalWidth = 0, logicalHeight = 0;

function keepTvFocus(){
  const input = document.getElementById('tvInput');
  if(input && document.activeElement !== input) input.focus();
}
setInterval(keepTvFocus, 300);

function resizeCanvas(){
  dpr = window.devicePixelRatio || 1;
  logicalWidth = container.clientWidth;
  logicalHeight = container.clientHeight;
  canvas.width = logicalWidth * dpr;
  canvas.height = logicalHeight * dpr;
  ctx.resetTransform();
  ctx.scale(dpr, dpr);
  if(!terrainHeights || terrainHeights.length === 0) initStage();
}
window.addEventListener('resize', resizeCanvas);

let terrainHeights = [], stickmen = [], projectile = null;
let currentTurn = 0, isShooting = false, moveDir = 0, angleDir = 0, isChargingPower = false;

function initStage(){
  const b = logicalHeight * 0.7;
  terrainHeights = new Float32Array(Math.ceil(logicalWidth) + 1);
  for(let x = 0; x <= logicalWidth; x++){
    terrainHeights[x] = b + Math.sin(x * 0.015) * 20 + Math.cos(x * 0.008) * 15;
  }

  stickmen = [
    { id: 0, isPlayer: true, x: 50, y: 0, angle: 45, power: 40, health: 100, color: '#2ecc71', facing: 1 },
    { id: 1, isPlayer: false, x: logicalWidth - 70, y: 0, angle: 45, power: 40, health: 100, color: '#e74c3c', facing: -1 }
  ];
  stickmen.forEach(s => updateY(s));
}

function getTerrainY(x){
  const i = Math.floor(x);
  if(i < 0) return terrainHeights[0] || logicalHeight * 0.7;
  if(i >= logicalWidth) return terrainHeights[Math.floor(logicalWidth)] || logicalHeight * 0.7;
  return terrainHeights[i];
}

function updateY(s){ s.y = getTerrainY(s.x) - 25; }

function fireProjectile(){
  if(isShooting) return;
  isShooting = true;
  let s = stickmen[currentTurn];
  const rad = s.angle * Math.PI / 180;
  const speed = 3 + (s.power / 100) * 10;
  
  projectile = {
    x: s.x,
    y: s.y,
    vx: Math.cos(rad) * speed * s.facing,
    vy: -Math.sin(rad) * speed,
    gravity: 0.2
  };
}

function drawBackground(){
  // Fundo original roxo/crepúsculo
  let grad = ctx.createLinearGradient(0, 0, 0, logicalHeight);
  grad.addColorStop(0, '#150a21');
  grad.addColorStop(0.5, '#4a154b');
  grad.addColorStop(1, '#8c245c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, logicalWidth, logicalHeight);

  // Montanhas de fundo
  ctx.fillStyle = 'rgba(40, 15, 55, 0.6)';
  ctx.beginPath();
  ctx.moveTo(0, logicalHeight);
  for(let x = 0; x <= logicalWidth; x += 10){
    ctx.lineTo(x, logicalHeight * 0.5 + Math.sin(x * 0.005) * 40);
  }
  ctx.lineTo(logicalWidth, logicalHeight);
  ctx.fill();

  // Terreno e linha verde cintilante
  ctx.beginPath();
  ctx.moveTo(0, logicalHeight);
  for(let x = 0; x <= logicalWidth; x += 2){
    ctx.lineTo(x, getTerrainY(x));
  }
  ctx.lineTo(logicalWidth, logicalHeight);
  ctx.fillStyle = '#2c1e14';
  ctx.fill();

  ctx.beginPath();
  for(let x = 0; x <= logicalWidth; x += 2){
    if(x === 0) ctx.moveTo(x, getTerrainY(x));
    else ctx.lineTo(x, getTerrainY(x));
  }
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawStickman(s){
  if(s.health <= 0) return;
  ctx.save();
  ctx.strokeStyle = s.color;
  ctx.lineWidth = 2;

  // Cabeça e Corpo de Palito
  ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s.x, s.y + 6); ctx.lineTo(s.x, s.y + 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s.x, s.y + 20); ctx.lineTo(s.x - 5, s.y + 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s.x, s.y + 20); ctx.lineTo(s.x + 5, s.y + 28); ctx.stroke();

  // Linha Amarela de Mira
  if(s.isPlayer && !isShooting){
    const rad = s.angle * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + 10);
    ctx.lineTo(s.x + Math.cos(rad) * 30 * s.facing, s.y + 10 - Math.sin(rad) * 30);
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function updateGame(delta){
  const s = stickmen[currentTurn];
  if(s && s.isPlayer && !isShooting){
    if(moveDir !== 0){
      s.x = Math.max(15, Math.min(logicalWidth - 15, s.x + moveDir * 1.5));
      updateY(s);
    }
    if(angleDir !== 0){
      s.angle = Math.max(0, Math.min(85, s.angle + angleDir * 1.2));
    }
    if(isChargingPower){
      s.power = (s.power + 1) % 100;
      document.getElementById('powerText').textContent = `${Math.floor(s.power)}%`;
    }
  }

  if(projectile){
    projectile.vy += projectile.gravity;
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;

    if(projectile.y >= getTerrainY(projectile.x)){
      projectile = null;
      isShooting = false;
      currentTurn = (currentTurn + 1) % stickmen.length;
      if(!stickmen[currentTurn].isPlayer){
        setTimeout(() => {
          stickmen[1].angle = 30 + Math.random() * 30;
          stickmen[1].power = 30 + Math.random() * 40;
          fireProjectile();
        }, 800);
      }
    }
  }
}

function gameLoop(){
  updateGame();
  ctx.clearRect(0, 0, logicalWidth, logicalHeight);
  drawBackground();
  stickmen.forEach(s => drawStickman(s));

  if(projectile){
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcc00';
    ctx.fill();
  }
  requestAnimationFrame(gameLoop);
}

function handleKey(e, isDown){
  keepTvFocus();
  const code = e.keyCode || e.which;
  const key = (e.key || '').toLowerCase();

  // Movimento: Setas, A/D, Teclas Coloridas
  if(code === 37 || key === 'a' || code === 403 || key === 'r') moveDir = isDown ? -1 : 0;
  if(code === 39 || key === 'd' || code === 404 || key === 'g') moveDir = isDown ? 1 : 0;

  // Mira: Setas, W/S, CH+/CH- (33/34), Teclas 1/2
  if(code === 38 || key === 'w' || code === 405 || key === 'y' || code === 33 || code === 427 || key === '1') angleDir = isDown ? 1 : 0;
  if(code === 40 || key === 's' || code === 406 || key === 'b' || code === 34 || code === 428 || key === '2') angleDir = isDown ? -1 : 0;

  // Disparo: OK / ENTER / ESPAÇO
  if(code === 13 || code === 32 || key === 'enter' || key === 'ok' || key === ' ') {
    if(isDown){
      if(!isShooting && !isChargingPower) isChargingPower = true;
    } else {
      if(isChargingPower){
        isChargingPower = false;
        fireProjectile();
      }
    }
  }
}

window.addEventListener('keydown', e => handleKey(e, true));
window.addEventListener('keyup', e => handleKey(e, false));

resizeCanvas();
initStage();
gameLoop();
</script>
</body>
</html>
