<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha - Terreno Destrutível & Sons</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0d0914;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;outline:none}
button, input, a { outline: none !important; }

#tvInput {
  position: absolute;
  top: -100px;
  left: -100px;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

/* Faixa Superior Escura */
.top-bar {
  width: 100%;
  height: 48px;
  background: #120c1f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 10;
  flex-shrink: 0;
}
.player-info { display: flex; align-items: center; gap: 8px; }
.dot-green { width: 10px; height: 10px; background: #00ff66; border-radius: 50%; display: inline-block; }
.p-label { color: #ffffff; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
.hp-bar-bg { width: 120px; height: 14px; background: #1a1228; border-radius: 10px; padding: 2px; border: 1px solid rgba(255,255,255,0.15); }
.hp-fill-green { width: 100%; height: 100%; background: #2ecc71; border-radius: 8px; transition: width 0.3s; }
.hp-fill-red { width: 100%; height: 100%; background: #ff4757; border-radius: 8px; transition: width 0.3s; }

.center-header { text-align: center; }
.phase-title { color: #f1c40f; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.sub-info { color: #f1c40f; font-size: 10px; opacity: 0.8; font-weight: 600; margin-top: 1px; }

/* Sub-header "SUA VEZ" */
.sub-turn-bar {
  width: 100%;
  height: 22px;
  background: rgba(18, 12, 31, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #f1c40f;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.ammo-tag {
  background: #2b223d;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid #f1c40f;
  color: #fff;
  font-weight: 900;
}

/* Canvas da Arena */
.canvas-container { flex: 1; position: relative; width: 100%; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; }

/* Painel Inferior de Controles */
.bottom-controls {
  width: 100%;
  height: 75px;
  background: #110b1a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}

.control-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-label { color: #8a8599; font-size: 10px; font-weight: 800; margin-right: 4px; }

.btn-ctrl {
  width: 38px;
  height: 38px;
  background: #2b223d;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn-power {
  width: 62px;
  height: 42px;
  background: linear-gradient(180deg, #ffc107, #ff9800);
  border: none;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #000;
  font-weight: 900;
  box-shadow: 0 0 12px rgba(255, 152, 0, 0.4);
}
.btn-power .icon { font-size: 14px; }
.btn-power .val { font-size: 10px; margin-top: -2px; }

.btn-fire-round {
  width: 44px;
  height: 42px;
  background: linear-gradient(180deg, #ffc107, #ff9800);
  border: none;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px rgba(255, 152, 0, 0.4);
  cursor: pointer;
}
.inner-circle {
  width: 20px;
  height: 20px;
  background: #1a1228;
  border-radius: 50%;
}
</style>
</head>
<body id="gameBody" oncontextmenu="return false;">

<input type="text" id="tvInput" readonly>

<div class="top-bar">
  <div class="player-info">
    <span class="dot-green"></span>
    <span class="p-label">VOCÊ</span>
    <div class="hp-bar-bg"><div id="hpPlayer" class="hp-fill-green"></div></div>
  </div>

  <div class="center-header">
    <div class="phase-title">⚔️ FASE 1/20</div>
    <div class="sub-info">🌙 5% - 00:05</div>
  </div>

  <div class="player-info">
    <div class="hp-bar-bg"><div id="hpEnemy" class="hp-fill-red"></div></div>
    <span class="p-label">ROBÔ</span>
    <span style="font-size:14px">🤖</span>
  </div>
</div>

<div class="sub-turn-bar">
  <div><span class="dot-green"></span> <span>SUA VEZ (🔴 🟢 🟡 🔵 / 5)</span></div>
  <div class="ammo-tag" id="ammoDisplay">MÚNICAO [1]: MÍSSIL PADRÃO</div>
</div>

<div class="canvas-container" id="canvasContainer">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="bottom-controls">
  <div class="control-card">
    <span class="card-label">MOV</span>
    <button class="btn-ctrl" id="btnLeft" tabindex="-1">◀</button>
    <button class="btn-ctrl" tabindex="-1">➖</button>
    <div class="btn-power" id="btnPower">
      <span class="icon">🔥</span>
      <span class="val" id="powerVal">0%</span>
    </div>
    <button class="btn-ctrl" tabindex="-1">➕</button>
    <button class="btn-ctrl" id="btnRight" tabindex="-1">▶</button>
  </div>

  <div class="control-card">
    <span class="card-label">MIRA</span>
    <button class="btn-ctrl" id="btnUp" tabindex="-1">▲</button>
    <button class="btn-ctrl" id="btnDown" tabindex="-1">▼</button>
    <button class="btn-fire-round" id="btnFire" tabindex="-1">
      <div class="inner-circle"></div>
    </button>
    <button class="btn-ctrl" tabindex="-1">💣</button>
  </div>
</div>

<script>
// Sistema de Som (Sintetizador Web Audio API)
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio(){
  if(!audioCtx) audioCtx = new AudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type){
  initAudio();
  if(!audioCtx) return;

  const now = audioCtx.currentTime;
  if(type === 'shoot'){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  } else if(type === 'explode'){
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, now);
    filter.frequency.linearRampToValueAtTime(50, now + 0.4);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);

    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(now); noise.stop(now + 0.4);
  } else if(type === 'select'){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.setValueAtTime(800, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.15);
  }
}

const canvas = document.getElementById('gameCanvas');
const container = document.getElementById('canvasContainer');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1, logicalWidth = 0, logicalHeight = 0;

function keepTvFocus(){
  const input = document.getElementById('tvInput');
  if(input && document.activeElement !== input) input.focus();
}
setInterval(keepTvFocus, 300);

function resizeCanvas(){
  dpr = window.devicePixelRatio || 1;
  logicalWidth = container.clientWidth;
  logicalHeight = container.clientHeight;
  canvas.width = logicalWidth * dpr;
  canvas.height = logicalHeight * dpr;
  ctx.resetTransform();
  ctx.scale(dpr, dpr);
  if(!terrainHeights || terrainHeights.length === 0) initGame();
}
window.addEventListener('resize', resizeCanvas);

let terrainHeights = [], player = {}, enemy = {}, projectile = null, explosionAnim = null;
let isShooting = false, moveDir = 0, angleDir = 0, isChargingPower = false;
let selectedWeapon = 1; // 1 = Míssil Padrão, 2 = Super Bomba

function selectWeapon(id){
  selectedWeapon = id;
  const ammoDisplay = document.getElementById('ammoDisplay');
  if(id === 1){
    ammoDisplay.textContent = 'MÚNICAO [1]: MÍSSIL PADRÃO';
  } else {
    ammoDisplay.textContent = 'MÚNICAO [2]: SUPER BOMBA PESADA';
  }
  playSound('select');
}

function initGame(){
  const b = logicalHeight * 0.62;
  terrainHeights = new Float32Array(Math.ceil(logicalWidth) + 1);
  
  for(let x = 0; x <= logicalWidth; x++){
    terrainHeights[x] = b + Math.sin(x * 0.012) * 35 + Math.cos(x * 0.006) * 20;
  }

  player = { x: 50, y: 0, angle: 40, power: 0, facing: 1 };
  enemy  = { x: logicalWidth - 50, y: 0, health: 100 };
  updatePositions();
}

function getTerrainY(x){
  const i = Math.floor(x);
  if(i < 0) return terrainHeights[0] || logicalHeight * 0.62;
  if(i >= logicalWidth) return terrainHeights[Math.floor(logicalWidth)] || logicalHeight * 0.62;
  return terrainHeights[i];
}

/* Destruição Real do Terreno */
function destroyTerrain(impactX, radius){
  const startX = Math.max(0, Math.floor(impactX - radius));
  const endX = Math.min(logicalWidth, Math.ceil(impactX + radius));

  for(let x = startX; x <= endX; x++){
    const dist = Math.abs(x - impactX);
    if(dist < radius){
      const depth = Math.sqrt(radius * radius - dist * dist);
      terrainHeights[x] += depth * 0.85; // Afunda o chão criando a cratera
    }
  }
  updatePositions();
}

function updatePositions(){
  player.y = getTerrainY(player.x) - 20;
  enemy.y  = getTerrainY(enemy.x) - 20;
}

function fireProjectile(){
  if(isShooting) return;
  isShooting = true;
  playSound('shoot');

  const rad = player.angle * Math.PI / 180;
  const speed = 3 + (player.power / 100) * 11;
  
  projectile = {
    x: player.x,
    y: player.y - 8,
    vx: Math.cos(rad) * speed * player.facing,
    vy: -Math.sin(rad) * speed,
    gravity: 0.18,
    type: selectedWeapon
  };
}

function drawBackground(){
  let grad = ctx.createLinearGradient(0, 0, 0, logicalHeight);
  grad.addColorStop(0, '#190a28');
  grad.addColorStop(0.4, '#4a154b');
  grad.addColorStop(0.7, '#8a2b43');
  grad.addColorStop(1, '#e65c40');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, logicalWidth, logicalHeight);

  ctx.beginPath();
  ctx.arc(logicalWidth * 0.48, logicalHeight * 0.6, 25, 0, Math.PI * 2);
  ctx.fillStyle = '#ffeb3b';
  ctx.fill();

  ctx.fillStyle = '#2b1033';
  ctx.beginPath();
  ctx.moveTo(0, logicalHeight);
  for(let x = 0; x <= logicalWidth; x += 10){
    ctx.lineTo(x, logicalHeight * 0.52 + Math.sin(x * 0.005) * 40);
  }
  ctx.lineTo(logicalWidth, logicalHeight);
  ctx.fill();

  // Terreno Destrutível
  ctx.beginPath();
  ctx.moveTo(0, logicalHeight);
  for(let x = 0; x <= logicalWidth; x += 2){
    ctx.lineTo(x, getTerrainY(x));
  }
  ctx.lineTo(logicalWidth, logicalHeight);
  ctx.fillStyle = '#241a15';
  ctx.fill();

  ctx.beginPath();
  for(let x = 0; x <= logicalWidth; x += 2){
    if(x === 0) ctx.moveTo(x, getTerrainY(x));
    else ctx.lineTo(x, getTerrainY(x));
  }
  ctx.strokeStyle = '#2ecc71';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawCharacters(){
  ctx.save();
  ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(player.x, player.y, 6, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#2ecc71'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(player.x, player.y+6); ctx.lineTo(player.x, player.y+18); ctx.stroke();

  if(!isShooting){
    const rad = player.angle * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y + 4);
    ctx.lineTo(player.x + Math.cos(rad)*25*player.facing, player.y + 4 - Math.sin(rad)*25);
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 6, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#e74c3c'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(enemy.x, enemy.y+6); ctx.lineTo(enemy.x, enemy.y+18); ctx.stroke();
  
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText("Pts:0", enemy.x, enemy.y - 14);
  ctx.restore();
}

function updateGame(){
  if(!isShooting){
    if(moveDir !== 0){
      player.x = Math.max(15, Math.min(logicalWidth - 15, player.x + moveDir * 1.5));
      updatePositions();
    }
    if(angleDir !== 0){
      player.angle = Math.max(-10, Math.min(85, player.angle + angleDir * 1.2));
    }
    if(isChargingPower){
      player.power += 1.5;
      // Ao atingir 100%, dispara automaticamente!
      if(player.power >= 100){
        player.power = 100;
        document.getElementById('powerVal').textContent = `100%`;
        isChargingPower = false;
        fireProjectile();
      } else {
        document.getElementById('powerVal').textContent = `${Math.floor(player.power)}%`;
      }
    }
  }

  if(projectile){
    projectile.vy += projectile.gravity;
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;

    if(projectile.y >= getTerrainY(projectile.x)){
      const radius = projectile.type === 2 ? 28 : 16;
      destroyTerrain(projectile.x, radius);
      
      explosionAnim = { x: projectile.x, y: projectile.y, r: 2, maxR: radius };
      playSound('explode');

      projectile = null;
      isShooting = false;
      player.power = 0;
      document.getElementById('powerVal').textContent = `0%`;
    }
  }
}

function gameLoop(){
  updateGame();
  ctx.clearRect(0, 0, logicalWidth, logicalHeight);
  drawBackground();
  drawCharacters();

  if(projectile){
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, projectile.type === 2 ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = projectile.type === 2 ? '#ff4757' : '#f1c40f';
    ctx.fill();
  }

  if(explosionAnim){
    ctx.beginPath();
    ctx.arc(explosionAnim.x, explosionAnim.y, explosionAnim.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 152, 0, 0.7)';
    ctx.fill();
    explosionAnim.r += 2;
    if(explosionAnim.r >= explosionAnim.maxR) explosionAnim = null;
  }

  requestAnimationFrame(gameLoop);
}

function handleKey(e, isDown){
  keepTvFocus();
  const code = e.keyCode || e.which;
  const key = (e.key || '').toLowerCase();
  const eCode = e.code || '';

  // Seleção de Munição (Teclas 1 e 2)
  if(code === 49 || key === '1' || eCode === 'Digit1'){
    if(e.preventDefault) e.preventDefault();
    selectWeapon(1);
    return;
  }
  if(code === 50 || key === '2' || eCode === 'Digit2'){
    if(e.preventDefault) e.preventDefault();
    selectWeapon(2);
    return;
  }

  const isButtonFive = (code === 53 || code === 101 || key === '5' || eCode === 'Digit5' || eCode === 'Numpad5');

  if(code === 403 || key === 'r' || code === 37 || key === 'a') {
    if(e.preventDefault) e.preventDefault();
    moveDir = isDown ? -1 : 0;
  }

  if(code === 404 || key === 'g' || code === 39 || key === 'd') {
    if(e.preventDefault) e.preventDefault();
    moveDir = isDown ? 1 : 0;
  }

  if(code === 405 || key === 'y' || code === 38 || key === 'w') {
    if(e.preventDefault) e.preventDefault();
    angleDir = isDown ? 1 : 0;
  }

  if(code === 406 || key === 'b' || code === 40 || key === 's') {
    if(e.preventDefault) e.preventDefault();
    angleDir = isDown ? -1 : 0;
  }

  if(isButtonFive || code === 32 || key === ' ') {
    if(e.preventDefault) e.preventDefault();
    if(isDown){
      if(!isShooting && !isChargingPower) {
        player.power = 0;
        isChargingPower = true;
      }
    } else {
      if(isChargingPower){
        isChargingPower = false;
        fireProjectile();
      }
    }
  }
}

window.addEventListener('keydown', e => handleKey(e, true), true);
window.addEventListener('keyup', e => handleKey(e, false), true);

const btnFire = document.getElementById('btnFire');
btnFire.addEventListener('mousedown', () => { if(!isShooting) { player.power = 0; isChargingPower = true; } });
btnFire.addEventListener('mouseup', () => { if(isChargingPower){ isChargingPower = false; fireProjectile(); } });
btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); if(!isShooting) { player.power = 0; isChargingPower = true; } });
btnFire.addEventListener('touchend', (e) => { e.preventDefault(); if(isChargingPower){ isChargingPower = false; fireProjectile(); } });

resizeCanvas();
initGame();
gameLoop();
</script>
</body>
</html>
