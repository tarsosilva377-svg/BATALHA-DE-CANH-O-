<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha de Palitos - IA Estratégica & Smart TV Controls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0714;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.health-top{width:100%;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,14,35,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(241,196,15,.2);height:44px;z-index:10;flex-shrink:0}
.player-box{display:flex;align-items:center;gap:8px;flex:1}
.player-box.right{flex-direction:row-reverse}
.player-label{color:#fff;font-weight:800;font-size:11px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.health-bar{width:110px;height:12px;background:#0a0812;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.health-fill{height:100%;transition:width.4s cubic-bezier(.4,0,.2,1);border-radius:10px}
.green-fill{background:linear-gradient(90deg,#00ff88,#2ecc71);box-shadow:0 0 10px rgba(46,204,113,.6)}
.red-fill{background:linear-gradient(90deg,#ff4757,#e74c3c);box-shadow:0 0 10px rgba(231,76,60,.6)}
.center-info{text-align:center}
.vs-text{color:#fff;font-weight:900;font-size:12px;background:linear-gradient(90deg,#f1c40f,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.time-text{color:#f1c40f;font-size:9px;font-weight:600;opacity:.9}
.turn-line{width:100%;padding:4px 6px;text-align:center;background:linear-gradient(90deg,rgba(241,196,15,.15),rgba(241,196,15,.05));color:#f1c40f;font-weight:700;font-size:10px;letter-spacing:0.5px;border-bottom:1px solid rgba(241,196,15,.1);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;width:100%}
canvas{width:100%;height:100%;display:block}
.controls{width:100%;padding:6px 10px;background:rgba(18,13,32,.98);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;flex-shrink:0}
.pad-group{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);padding:4px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.pad-label{color:#888;font-size:8px;font-weight:800;letter-spacing:1px}
.btn-game{background:linear-gradient(180deg,#3a2d5e,#2b1f47);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-weight:700;box-shadow:0 3px 6px rgba(0,0,0,.3);transition:transform.1s;cursor:pointer;outline:none}
.btn-game:active,.btn-game.active-key{transform:scale(.93);background:#4a3a75}
.btn-move{width:36px;height:38px;font-size:14px}
.btn-aim{width:32px;height:38px;font-size:12px}
.btn-fire-direct{width:54px;height:38px;background:linear-gradient(180deg,#ffd32a,#ff6b00);color:#000;font-weight:900;border:none;border-radius:10px;box-shadow:0 0 14px rgba(255,107,0,.5),0 3px 6px rgba(0,0,0,.3);font-size:10px;line-height:1.1;transition:transform.1s;cursor:pointer;outline:none}
.btn-fire-direct:active,.btn-fire-direct.active-key{transform:scale(.92)}
.ammo-btn{width:32px;height:38px;border-radius:8px;background:#2b1f47;color:#fff;font-size:14px;border:1px solid rgba(255,255,255,.1);cursor:pointer;outline:none}
.ammo-btn.active{background:linear-gradient(180deg,#f1c40f,#d48806);color:#000;box-shadow:0 0 10px rgba(241,196,15,.6);border:none}
.ammo-btn.red-ammo.active{background:linear-gradient(180deg,#ff4757,#e74c3c);color:#fff;box-shadow:0 0 10px rgba(231,76,60,.8)}
.ammo-btn.green-ammo.active{background:linear-gradient(180deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 0 10px rgba(46,204,113,.8)}
.ai-ammo-indicator{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.95);color:#fff;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:15}
.modal-overlay{position:absolute;inset:0;background:rgba(5,3,12,.9);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:linear-gradient(180deg,#241b3f,#1a132e);border:2px solid #f1c40f;border-radius:18px;padding:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(241,196,15,.2);width:290px;display:flex;flex-direction:column;gap:10px}
.modal-title{font-size:18px;font-weight:900;color:#fff}
.modal-desc{color:#b8b0d0;font-size:12px}
.modal-btns{display:flex;gap:8px}
.btn-modal{background:linear-gradient(180deg,#00d26a,#27ae60);color:#fff;border:none;padding:10px;font-size:12px;font-weight:800;border-radius:8px;cursor:pointer;flex:1}
.btn-modal.secondary{background:linear-gradient(180deg,#3498db,#2471a3)}
#powerText{font-size:8px;font-weight:900}
</style>
</head>
<body oncontextmenu="return false;">
<div class="health-top">
<div class="player-box"><span class="player-label" id="playerTeamLabel">🟢 VOCÊ</span><div class="health-bar"><div id="healthGreen" class="health-fill green-fill" style="width:100%"></div></div></div>
<div class="center-info"><div class="vs-text" id="stageIndicator">⚔️ FASE 1/20</div><div class="time-text" id="timeIndicator">🌙 00:00</div></div>
<div class="player-box right"><span class="player-label" id="enemyTeamLabel">🤖 ROBO</span><div class="health-bar"><div id="healthRed" class="health-fill red-fill" style="width:100%"></div></div></div>
</div>
<div class="turn-line" id="turnIndicator">🟢 SUA VEZ — [🛈 Mover: 4 / 6 | Mira: 2 / 8 | Força: 1 / 3 | Atirar: 5 | Munição: 🔴 / 🟢]</div>
<div class="canvas-container" id="canvasContainer">
<div class="ai-ammo-indicator" id="aiAmmoIndicator">🤖 IA equipou: ⚫</div>
<canvas id="gameCanvas"></canvas>
<div class="modal-overlay" id="gameModal"><div class="modal-card"><div class="modal-title" id="modalTitle">🎉 FASE CONCLUÍDA!</div><div class="modal-desc" id="modalDesc"></div><div class="modal-btns"><button class="btn-modal secondary" id="btnContinue" onclick="nextStage()">CONTINUAR</button><button class="btn-modal" onclick="resetGame(true)">JOGAR DE NOVO</button></div></div></div>
</div>
<div class="controls">
<div class="pad-group"><span class="pad-label">MOV</span><button class="btn-game btn-move" id="moveLeftBtn" title="Tecla 4">◀ (4)</button><button class="btn-game btn-aim" id="forceMinusBtn" title="Tecla 1">➖ (1)</button><button class="btn-fire-direct" id="fireBtn" title="Tecla 5 / OK / Espaço">🔥<br><span id="powerText">40%</span></button><button class="btn-game btn-aim" id="forcePlusBtn" title="Tecla 3">➕ (3)</button><button class="btn-game btn-move" id="moveRightBtn" title="Tecla 6">▶ (6)</button></div>
<div class="pad-group"><span class="pad-label">MIRA</span><button class="btn-game btn-aim" id="anglePlusBtn" title="Tecla 2">🔼 (2)</button><button class="btn-game btn-aim" id="angleMinusBtn" title="Tecla 8">🔽 (8)</button><button class="ammo-btn red-ammo active" data-weapon="0" title="Vermelho: Normal">🔴</button><button class="ammo-btn green-ammo" data-weapon="1" title="Verde: Maior Dano">🟢</button></div>
</div>

<script>
const AudioFX={ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},playShoot(){this.init();const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(40,n+.25);g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.01,n+.25);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+.25);},playExplosion(){this.init();const n=this.ctx.currentTime,s=this.ctx.sampleRate*.5,b=this.ctx.createBuffer(1,s,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<s;i++)d[i]=Math.random()*2-1;const w=this.ctx.createBufferSource();w.buffer=b;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(800,n);f.frequency.exponentialRampToValueAtTime(30,n+.5);const g=this.ctx.createGain();g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(.01,n+.5);w.connect(f);f.connect(g);g.connect(this.ctx.destination);w.start(n);w.stop(n+.5);}};
const canvas=document.getElementById('gameCanvas');const container=document.getElementById('canvasContainer');const ctx=canvas.getContext('2d');
let dpr=window.devicePixelRatio||1,logicalWidth=0,logicalHeight=0,currentStage=1;const maxStages=20;let matchTime=0;const totalDayDuration=90;
const aiGlobalBrain={redTanks:{},successfulShotsMemory:[]};
function getOrCreateAiBrain(id){if(!aiGlobalBrain.redTanks[id])aiGlobalBrain.redTanks[id]={powerCorrection:0,angleCorrection:0,score:0,shotsCount:0,lastShotInfo:null,wasHitLastTurn:false};return aiGlobalBrain.redTanks[id];}

function resizeCanvas(){
dpr=window.devicePixelRatio||1;
logicalWidth=container.clientWidth;
logicalHeight=container.clientHeight;
canvas.width=logicalWidth*dpr;
canvas.height=logicalHeight*dpr;
ctx.resetTransform();
ctx.scale(dpr,dpr);
if(!terrainHeights||terrainHeights.length===0)initStage();
}
window.addEventListener('resize',resizeCanvas);

let terrainHeights=[],rocks=[],tanks=[],effects=[],peakXsCache=[];

// Reajuste perfeito da trajetória: Velocidade equilibrada com gravidade realista
const weapons=[
  {name:'Normal',symbol:'🔴',speed:.21,damage:35,radius:22,gravity:.22,color:'#ff4757'},
  {name:'Bomba (Maior Dano)',symbol:'🟢',speed:.20,damage:60,radius:36,gravity:.23,color:'#2ecc71'}
];

function generateIrregularVertices(r){const v=[],p=5+Math.floor(Math.random()*3);for(let i=0;i<p;i++){const a=(i/p)*Math.PI*2,rv=r*(.7+Math.random()*.6);v.push({x:Math.cos(a)*rv,y:Math.sin(a)*rv});}return v;}

function initStage(){
const b=logicalHeight*.68;
terrainHeights=new Float32Array(Math.ceil(logicalWidth)+1);
const n=2+(currentStage%3),pf=Math.max(.06,.14-(currentStage*.003)),mh=Math.min(logicalHeight*.30,35+currentStage*2.5);
peakXsCache=[];
for(let p=1;p<=n;p++)peakXsCache.push((logicalWidth/(n+1))*p+((p%2===0)?20:-20));
for(let x=0;x<=logicalWidth;x++){
let y=b;
peakXsCache.forEach((px,i)=>{const no=(x-px)/(logicalWidth*pf),m=Math.max(0,(1-no*no))*(mh*(i%2===0?1:.85));y-=m;});
terrainHeights[x]=Math.max(25,y);
}
rocks=[];
peakXsCache.forEach(px=>{
const a=px-12,c=px+12;
rocks.push({x:a,y:getTerrainY(a)-6,vx:0,vy:0,angle:Math.random()*Math.PI,radius:6,peakRef:px,vertices:generateIrregularVertices(6)});
rocks.push({x:c,y:getTerrainY(c)-7,vx:0,vy:0,angle:Math.random()*Math.PI,radius:7,peakRef:px,vertices:generateIrregularVertices(7)});
});
tanks=[];
if(currentStage===20){
tanks.push({id:0,team:'green',isPlayer:true,x:20,y:0,width:20,height:28,angle:60,power:55,health:100,color:'#2ecc71',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1});
tanks.push({id:1,team:'green',isPlayer:false,x:55,y:0,width:20,height:28,angle:60,power:55,health:100,color:'#27ae60',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1,brain:getOrCreateAiBrain(1)});
tanks.push({id:2,team:'green',isPlayer:false,x:90,y:0,width:20,height:28,angle:60,power:60,health:100,color:'#1abc9c',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1,brain:getOrCreateAiBrain(2)});
tanks.push({id:3,team:'green',isPlayer:false,x:125,y:0,width:20,height:28,angle:60,power:65,health:100,color:'#16a085',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1,brain:getOrCreateAiBrain(3)});
tanks.push({id:4,team:'red',isPlayer:false,x:logicalWidth-40,y:0,width:20,height:28,angle:60,power:55,health:100,color:'#e74c3c',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,brain:getOrCreateAiBrain(4)});
tanks.push({id:5,team:'red',isPlayer:false,x:logicalWidth-75,y:0,width:20,height:28,angle:60,power:55,health:100,color:'#c0392b',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,brain:getOrCreateAiBrain(5)});
tanks.push({id:6,team:'red',isPlayer:false,x:logicalWidth-110,y:0,width:20,height:28,angle:60,power:60,health:100,color:'#d35400',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,brain:getOrCreateAiBrain(6)});
tanks.push({id:7,team:'red',isPlayer:false,x:logicalWidth-145,y:0,width:20,height:28,angle:60,power:65,health:100,color:'#e67e22',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,brain:getOrCreateAiBrain(7)});
document.getElementById('playerTeamLabel').textContent='🟢 ESQUADRÃO';document.getElementById('enemyTeamLabel').textContent='🤖 INIMIGOS (4)';
}else{
tanks.push({id:0,team:'green',isPlayer:true,x:30,y:0,width:20,height:28,angle:45,power:40,health:100,color:'#2ecc71',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1});
tanks.push({id:4,team:'red',isPlayer:false,x:logicalWidth-50,y:0,width:20,height:28,angle:45,power:40,health:100,color:'#e74c3c',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,brain:getOrCreateAiBrain(4)});
document.getElementById('playerTeamLabel').textContent='🟢 VOCÊ';document.getElementById('enemyTeamLabel').textContent='🤖 ROBO';
}
tanks.forEach(t=>updateTankY(t));currentTankIndex=0;effects=[];matchTime=0;
document.getElementById('stageIndicator').textContent=`⚔️ FASE ${currentStage}/${maxStages}`;
}

function getTerrainY(x){const i=Math.floor(x);if(i<0)return terrainHeights[0]||logicalHeight*.68;if(i>=logicalWidth)return terrainHeights[Math.floor(logicalWidth)]||logicalHeight*.68;return terrainHeights[i];}

function updatePhysicsObjects(){
rocks.forEach(r=>{
const g=getTerrainY(r.x)-r.radius;
if(r.y<g-2||Math.abs(r.vy||0)>.1){r.vy=(r.vy||0)+.18;r.y+=r.vy;const ly=getTerrainY(r.x-2),ry=getTerrainY(r.x+2),s=(ry-ly)/4;r.vx=(r.vx||0)*.92+s*.25;r.x+=r.vx;r.angle+=r.vx*.04;r.x=Math.max(10,Math.min(logicalWidth-10,r.x));if(r.y>=g){r.y=g;r.vy=0;if(Math.abs(r.vx)<.1){r.vx=0;r.vy=0;}}}else r.y=g;
});
for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.life-=.045;e.x+=e.vx;e.y+=e.vy;if(e.type==='smoke'||e.type==='fire')e.size=(e.size||2)+0.4;if(e.life<=0)effects.splice(i,1);}
}

function destroyTerrain(cx,ra,dp){
const sx=Math.max(0,Math.floor(cx-ra)),ex=Math.min(logicalWidth,Math.ceil(cx+ra));
for(let x=sx;x<=ex;x++){
const dx=x-cx;
if(dx*dx<ra*ra){terrainHeights[x]=Math.min(logicalHeight+20,terrainHeights[x]+Math.sqrt(ra*ra-dx*dx)*.8);}
}
let ap=peakXsCache[0],md=Math.abs(cx-peakXsCache[0]);
peakXsCache.forEach(px=>{let d=Math.abs(cx-px);if(d<md){md=d;ap=px;}});
rocks.forEach(r=>{const d=Math.hypot(cx-r.x,r.y-getTerrainY(r.x));if(r.peakRef===ap&&d<=ra+30){r.vy=-2.5;r.vx=(r.x>cx)?2.8:-2.8;}});
effects.push({type:'shockwave',x:cx,y:getTerrainY(cx),radius:5,maxRadius:ra*1.2,life:1});
for(let p=0;p<20;p++){let a=Math.random()*Math.PI*2,s=1+Math.random()*6;effects.push({type:'fire',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:.6+Math.random()*.4,size:4+Math.random()*6,color:Math.random()>.3?'#ff9900':'#ff3300'});}
for(let p=0;p<12;p++){let a=-Math.PI/2+(Math.random()*1.2-0.6),s=2+Math.random()*5;effects.push({type:'smoke',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.4,size:6+Math.random()*8});}
for(let p=0;p<12;p++){let a=Math.random()*Math.PI*2,s=2+Math.random()*5;effects.push({type:'debris',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.7+Math.random()*.3,size:2+Math.random()*3});}
}

function updateTankY(t){t.y=getTerrainY(t.x+t.width/2)-t.height;}

let currentTankIndex=0,selectedWeapon=0,isShooting=false,projectile=null,moveDir=0,angleDir=0,forceDir=0;

function fireProjectile(){
if(isShooting)return;
isShooting=true;AudioFX.playShoot();
let t=tanks[currentTankIndex];t.shootTimer=18;
let wi=selectedWeapon;
if(!t.isPlayer){
wi=t.chosenWeapon!==undefined?t.chosenWeapon:0;
document.getElementById('aiAmmoIndicator').textContent=`🤖 IA equipou: ${weapons[wi].symbol}`;
document.getElementById('aiAmmoIndicator').style.display='block';
}else document.getElementById('aiAmmoIndicator').style.display='none';

const w=weapons[wi];
const rad = t.angle * Math.PI / 180;
const pm = .5 + (t.power / 100) * 2.2;
const bs = w.speed * pm * (logicalWidth / 12);
const hx = t.x + t.width / 2;
const sy = t.y + 10;

const vx = Math.cos(rad) * bs * t.facing;
const vy = -Math.sin(rad) * bs;

const spawnOffset = 18;
projectile={x:hx+Math.cos(rad)*spawnOffset*t.facing,y:sy-Math.sin(rad)*spawnOffset,vx:vx,vy:vy,radius:3,explosionRadius:w.radius,gravity:w.gravity,damage:w.damage,color:w.color,shooterTeam:t.team,shooterId:t.id,trail:[]};
if(t.brain)t.brain.lastShotInfo={angle:t.angle,power:t.power,weaponIndex:wi,startX:t.x,startY:t.y};
for(let p=0;p<8;p++){let fa=rad+(Math.random()*.4-.2),fs=1+Math.random()*3;effects.push({type:'fire',x:hx+Math.cos(rad)*spawnOffset*t.facing,y:sy-Math.sin(rad)*spawnOffset,vx:Math.cos(fa)*fs*t.facing,vy:-Math.sin(fa)*fs,life:.3,size:3+Math.random()*4,color:'#ffaa00'});}
}

function drawWorld(){
matchTime+=1/60;let dp=Math.min(1,matchTime/totalDayDuration);
let skyGrad=ctx.createLinearGradient(0,0,0,logicalHeight);
skyGrad.addColorStop(0,'#3b1e54');skyGrad.addColorStop(0.35,'#9c3d54');skyGrad.addColorStop(0.65,'#d76f30');skyGrad.addColorStop(1,'#f3a953');
ctx.fillStyle=skyGrad;ctx.fillRect(0,0,logicalWidth,logicalHeight);

ctx.save();
ctx.fillStyle='rgba(255,230,200,0.85)';ctx.beginPath();ctx.arc(logicalWidth*0.5,logicalHeight*0.55,30,0,Math.PI*2);ctx.fill();
let sunGlow=ctx.createRadialGradient(logicalWidth*0.5,logicalHeight*0.55,30,logicalWidth*0.5,logicalHeight*0.55,100);
sunGlow.addColorStop(0,'rgba(255,180,80,0.4)');sunGlow.addColorStop(1,'rgba(255,100,0,0)');
ctx.fillStyle=sunGlow;ctx.beginPath();ctx.arc(logicalWidth*0.5,logicalHeight*0.55,100,0,Math.PI*2);ctx.fill();
ctx.restore();

ctx.fillStyle='#512347';ctx.beginPath();ctx.moveTo(0,logicalHeight);
for(let x=0;x<=logicalWidth;x+=10){let y=logicalHeight*0.45+Math.sin(x*0.008)*25+Math.cos(x*0.02)*12;ctx.lineTo(x,y);}
ctx.lineTo(logicalWidth,logicalHeight);ctx.fill();

ctx.fillStyle='#36173a';ctx.beginPath();ctx.moveTo(0,logicalHeight);
for(let x=0;x<=logicalWidth;x+=8){let y=logicalHeight*0.52+Math.sin(x*0.012+1)*20+Math.cos(x*0.025)*8;ctx.lineTo(x,y);}
ctx.lineTo(logicalWidth,logicalHeight);ctx.fill();

let mi=Math.floor(matchTime/60),se=Math.floor(matchTime%60);
document.getElementById('timeIndicator').textContent=`${dp<1?`🌙 ${Math.floor(dp*100)}%`:'☀️ DIA'} - ${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`;

ctx.beginPath();ctx.moveTo(0,logicalHeight);ctx.lineTo(0,getTerrainY(0));
for(let x=0;x<=logicalWidth;x+=2)ctx.lineTo(x,getTerrainY(x));
ctx.lineTo(logicalWidth,logicalHeight);
let terrGrad=ctx.createLinearGradient(0,logicalHeight*0.4,0,logicalHeight);
terrGrad.addColorStop(0,'#4a3728');terrGrad.addColorStop(0.2,'#302217');terrGrad.addColorStop(1,'#18100a');
ctx.fillStyle=terrGrad;ctx.fill();

ctx.strokeStyle='#1b1008';ctx.lineWidth=2;
for(let x=10;x<logicalWidth;x+=25){let ty=getTerrainY(x);ctx.beginPath();ctx.moveTo(x,ty+4);ctx.lineTo(x+Math.sin(x)*8,ty+18);ctx.stroke();}

ctx.beginPath();ctx.moveTo(0,getTerrainY(0));
for(let x=0;x<=logicalWidth;x+=2)ctx.lineTo(x,getTerrainY(x));
ctx.strokeStyle='#2e7d32';ctx.lineWidth=4;ctx.stroke();
ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.stroke();

for(const r of rocks){
ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.beginPath();
ctx.moveTo(r.vertices[0].x,r.vertices[0].y);
for(let v=1;v<r.vertices.length;v++)ctx.lineTo(r.vertices[v].x,r.vertices[v].y);
ctx.closePath();
let rGrad=ctx.createLinearGradient(-r.radius,-r.radius,r.radius,r.radius);
rGrad.addColorStop(0,'#7f8c8d');rGrad.addColorStop(1,'#2c3e50');
ctx.fillStyle=rGrad;ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
}

tanks.forEach(t=>drawStickman(t));

effects.forEach(e=>{
ctx.save();
if(e.type==='fire'){
ctx.beginPath();ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);
ctx.fillStyle=e.color;ctx.globalAlpha=e.life;ctx.fill();
}else if(e.type==='smoke'){
ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
ctx.fillStyle='rgba(60,50,60,0.4)';ctx.globalAlpha=e.life*0.6;ctx.fill();
}else if(e.type==='debris'){
ctx.beginPath();ctx.rect(e.x,e.y,e.size,e.size);
ctx.fillStyle='#2c3e50';ctx.globalAlpha=e.life;ctx.fill();
}else if(e.type==='shockwave'){
e.radius+=(e.maxRadius-e.radius)*.18;
ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
ctx.strokeStyle=`rgba(255,165,0,${e.life})`;ctx.lineWidth=4*e.life;ctx.stroke();
}
ctx.restore();
});

if(projectile){
projectile.trail.push({x:projectile.x,y:projectile.y});
if(projectile.trail.length>6)projectile.trail.shift();
ctx.save();ctx.strokeStyle='rgba(255,200,50,0.5)';ctx.lineWidth=2;
ctx.beginPath();
for(let i=0;i<projectile.trail.length;i++){
let p=projectile.trail[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
}
ctx.stroke();
ctx.shadowColor=projectile.color;ctx.shadowBlur=12;
ctx.beginPath();ctx.arc(projectile.x,projectile.y,projectile.radius+1,0,Math.PI*2);
ctx.fillStyle='#ffffff';ctx.fill();
ctx.strokeStyle=projectile.color;ctx.lineWidth=2;ctx.stroke();
ctx.restore();
}
}

function drawStickman(s){
if(s.health<=0)return;
ctx.save();
if(s.shootTimer>0)s.shootTimer--;
if(s.isMoving)s.walkCycle+=.35;

const cx=s.x+s.width/2,by=s.y+s.height;
const hr=5,hy=s.y+hr,ny=hy+hr,hpy=by-10,ll=10;
const isGreen=s.team==='green';
const bodyColor='#111111';
const gearColor=isGreen?'#27ae60':'#e74c3c';
const gunColor=isGreen?'#1e824c':'#c0392b';

ctx.strokeStyle=bodyColor;ctx.fillStyle=bodyColor;ctx.lineWidth=3;
ctx.lineCap='round';ctx.lineJoin='round';

let la=s.isMoving?Math.sin(s.walkCycle)*.6:0;
ctx.beginPath();ctx.moveTo(cx,hpy);ctx.lineTo(cx+Math.sin(la)*ll*s.facing,hpy+Math.cos(la)*ll);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx,hpy);ctx.lineTo(cx+Math.sin(-la)*ll*s.facing,hpy+Math.cos(-la)*ll);ctx.stroke();

ctx.beginPath();ctx.moveTo(cx,ny);ctx.lineTo(cx,hpy);ctx.stroke();

ctx.fillStyle=gearColor;
ctx.beginPath();ctx.arc(cx+s.facing,hpy+3,3,0,Math.PI*2);ctx.fill();

ctx.beginPath();ctx.arc(cx,hy,hr,0,Math.PI*2);
ctx.fillStyle=bodyColor;ctx.fill();ctx.stroke();

ctx.fillStyle=gearColor;
ctx.beginPath();ctx.arc(cx,hy-1,hr+1,Math.PI,Math.PI*2);ctx.fill();
ctx.fillRect(cx-hr-1,hy-2,(hr+1)*2,2);

ctx.fillStyle='#ffffff';
ctx.fillRect(cx+(s.facing*2)-2,hy-1,4,2);
ctx.strokeStyle='#111';ctx.lineWidth=1;
ctx.strokeRect(cx+(s.facing*2)-2,hy-1,4,2);

const sh=ny+2;
const ar=s.angle*Math.PI/180;

ctx.save();
ctx.translate(cx,sh);

let drawAngle = (s.facing === 1) ? -ar : (Math.PI + ar);
ctx.rotate(drawAngle);

let cannonLen=18,cannonWidth=7;
let cGrad=ctx.createLinearGradient(0,-cannonWidth/2,0,cannonWidth/2);
cGrad.addColorStop(0,'#555');cGrad.addColorStop(0.5,gunColor);cGrad.addColorStop(1,'#111');

ctx.fillStyle=cGrad;ctx.strokeStyle='#000';ctx.lineWidth=1.5;
ctx.fillRect(0,-cannonWidth/2,cannonLen,cannonWidth);
ctx.strokeRect(0,-cannonWidth/2,cannonLen,cannonWidth);
ctx.fillRect(cannonLen-2,-cannonWidth/2-1,3,cannonWidth+2);

ctx.fillStyle='#d35400';
ctx.beginPath();ctx.arc(3,0,6,0,Math.PI*2);ctx.fill();ctx.stroke();

ctx.restore();

ctx.strokeStyle=bodyColor;ctx.lineWidth=3;
let armX=cx+Math.cos(ar)*7*s.facing,armY=sh-Math.sin(ar)*7;
ctx.beginPath();ctx.moveTo(cx,sh);ctx.lineTo(armX,armY);ctx.stroke();

if(s.brain){
ctx.fillStyle='#f1c40f';ctx.font='900 8px Arial';ctx.textAlign='center';
ctx.fillText(`Pts:${s.brain.score}`,cx,s.y-8);
}
ctx.restore();
}

function updateProjectile(){
if(!projectile)return;
const steps = 3;
const subVx = projectile.vx / steps;
const subVy = projectile.vy / steps;
const subG = projectile.gravity / steps;

for(let step=0; step<steps; step++){
projectile.vy += subG;
projectile.x += subVx;
projectile.y += subVy;

let hit=false;
let directHitTarget=null;

for(let t of tanks){
if(t.health<=0||t.id===projectile.shooterId)continue;

const boxX=t.x-8;
const boxY=t.y-8;
const boxWidth=t.width+16;
const boxHeight=t.height+16;

if(projectile.x>=boxX&&projectile.x<=boxX+boxWidth&&projectile.y>=boxY&&projectile.y<=boxY+boxHeight){
hit=true;
directHitTarget=t;
break;
}
}

if(!hit&&projectile.y+projectile.radius>=getTerrainY(projectile.x)){
hit=true;
}

if(hit){
destroyTerrain(projectile.x,projectile.explosionRadius,projectile.damage);
tanks.forEach(t=>updateTankY(t));

const at=tanks.find(t=>t.id===projectile.shooterId);
let td=0;

tanks.forEach(t=>{
if(t.health<=0)return;

const cx=t.x+t.width/2;
const cy=t.y+t.height/2;
const dist=Math.hypot(projectile.x-cx,projectile.y-cy);

if(t===directHitTarget||dist<=projectile.explosionRadius+20){
let dmg=projectile.damage;

if(t!==directHitTarget&&dist>12){
dmg=Math.max(15,Math.floor(projectile.damage*(1-(dist/(projectile.explosionRadius+20)))));
}

const ad=Math.min(t.health,dmg);
t.health=Math.max(0,t.health-dmg);

if(!t.isPlayer&&t.brain&&ad>0)t.brain.wasHitLastTurn=true;
if(at&&t.team!==at.team)td+=ad;
}
});

if(at&&!at.isPlayer&&at.brain){
at.brain.shotsCount++;
if(td>0){
at.brain.score+=Math.floor(td*2);
aiGlobalBrain.successfulShotsMemory.push({fromX:at.x,toX:projectile.x,angle:at.angle,power:at.power,terrainHeightAtShot:getTerrainY(at.x)});
}
}

updateHealthBars();
AudioFX.playExplosion();
projectile=null;
isShooting=false;

if(!checkWin())nextTurn();
break;
}
}
}

function nextTurn(){
do{currentTankIndex=(currentTankIndex+1)%tanks.length;}while(tanks[currentTankIndex].health<=0);
const a=tanks[currentTankIndex];
if(a.isPlayer){
document.getElementById('turnIndicator').textContent='🟢 SUA VEZ — [🛈 Mover: 4 / 6 | Mira: 2 / 8 | Força: 1 / 3 | Atirar: 5 | Munição: 🔴 / 🟢]';
document.getElementById('aiAmmoIndicator').style.display='none';
document.getElementById('powerText').textContent=`${Math.floor(a.power)}%`;
}else if(a.team==='green'){
document.getElementById('turnIndicator').textContent='🟢 ALIADO ATIRANDO...';
document.getElementById('aiAmmoIndicator').style.display='none';
setTimeout(()=>executeAIShot(a),300);
}else{
document.getElementById('turnIndicator').textContent='🤖 IA SIMULANDO TRAJETÓRIA...';
const cy=getTerrainY(a.x),ly=getTerrainY(a.x-20),ry=getTerrainY(a.x+20),ic=(ly<cy-12)&&(ry<cy-12);
if((a.brain&&a.brain.wasHitLastTurn)||ic){
if(a.brain)a.brain.wasHitLastTurn=false;
const mt=(ly<ry)?(a.x-45):(a.x+45);
a.targetX=Math.max(20,Math.min(logicalWidth-30,mt));
a.isMoving=true;
a.facing=(a.targetX>a.x)?1:-1;
}else{
a.targetX=a.x;
setTimeout(()=>executeAIShot(a),300);
}
}
}

// SIMULADOR DE TRAJETÓRIA VIRTUAL PARA IA (OPÇÃO A)
function simulateShotVirtual(shooter, ad, pv, wo) {
const rad = ad * Math.PI / 180;
const pm = .5 + (pv / 100) * 2.2;
const bs = wo.speed * pm * (logicalWidth / 12);
const hx = shooter.x + shooter.width / 2;
const sy = shooter.y + 10;
const spawnOffset = 18;

let x = hx + Math.cos(rad) * spawnOffset * shooter.facing;
let y = sy - Math.sin(rad) * spawnOffset;
let vx = Math.cos(rad) * bs * shooter.facing;
let vy = -Math.sin(rad) * bs;

// Correção do Bug de Curto Alcance: ignora colisão com o próprio robô no primeiro metro
for (let s = 0; s < 450; s++) {
vy += wo.gravity;
x += vx;
y += vy;

for (let t of tanks) {
if (t.health <= 0 || t.id === shooter.id) continue;
const boxX = t.x - 10;
const boxY = t.y - 10;
const boxWidth = t.width + 20;
const boxHeight = t.height + 20;

if (x >= boxX && x <= boxX + boxWidth && y >= boxY && y <= boxY + boxHeight) {
return { hitX: x, hitY: y, hitTank: t, directHit: true };
}
}

if (x < 0 || x > logicalWidth || y > logicalHeight) {
return { hitX: x, hitY: y, collidedTerrain: true };
}

const ty = getTerrainY(x);
if (y >= ty) {
return { hitX: x, hitY: ty, collidedTerrain: true };
}
}
return { hitX: x, hitY: y, collidedTerrain: false };
}

function executeAIShot(at){
if(at.health<=0)return;
const en=tanks.filter(t=>t.team!==at.team&&t.health>0);
if(!en.length)return;

let tg=en[0];
if(currentStage>=6)tg=en.reduce((l,c)=>(c.health<l.health?c:l),en[0]);
else tg=en[Math.floor(Math.random()*en.length)];

const tcx=tg.x+8, acx=at.x+8, dist=Math.abs(acx-tcx);
at.facing=(tcx>acx)?1:-1;

let cwi=0;
if(currentStage>=10 && (dist<140 || tg.health<=50)) cwi=1;
at.chosenWeapon=cwi;
const wp=weapons[cwi];

let bestAngle = 45;
let bestPower = 50;
let minDistanceToTarget = Infinity;
let foundDirectHit = false;

// ALGORITMO DE SIMULAÇÃO INTELIGENTE (Testa dezenas de trajetórias antes de atirar)
const testAngles = [15, 25, 35, 45, 55, 65, 75, 82];
for(let aCode of testAngles){
for(let pCode = 15; pCode <= 100; pCode += 3){
const simResult = simulateShotVirtual(at, aCode, pCode, wp);

// Se acertar o robô ou causar explosão perto
if(simResult.hitTank && simResult.hitTank.team !== at.team){
bestAngle = aCode;
bestPower = pCode;
foundDirectHit = true;
break;
}

// Se colidir com terreno próximo do inimigo (Área de dano de raio)
if(simResult.collidedTerrain){
let distToEnemy = Math.abs(simResult.hitX - tcx);
if(distToEnemy < wp.radius * 0.85){
bestAngle = aCode;
bestPower = pCode;
foundDirectHit = true;
break;
}

if(distToEnemy < minDistanceToTarget){
minDistanceToTarget = distToEnemy;
bestAngle = aCode;
bestPower = pCode;
}
}
}
if(foundDirectHit) break;
}

at.angle = bestAngle;
at.power = Math.min(100, Math.max(10, bestPower));
fireProjectile();
}

function updateAI(){
const a=tanks[currentTankIndex];
if(!a.isPlayer&&a.isMoving){
// Ajustada velocidade de caminhada para 1.8 (mais suave e firme)
const s=1.8;
if(Math.abs(a.x-a.targetX)>s){
a.x+=(a.targetX>a.x)?s:-s;
updateTankY(a);
}else{
a.x=a.targetX;
a.isMoving=false;
setTimeout(()=>executeAIShot(a),200);
}
}
}

function updateHealthBars(){
let gt=tanks.filter(t=>t.team==='green').length,rt=tanks.filter(t=>t.team==='red').length,ga=tanks.filter(t=>t.team==='green').reduce((a,t)=>a+t.health,0)/gt,ra=tanks.filter(t=>t.team==='red').reduce((a,t)=>a+t.health,0)/rt;
document.getElementById('healthGreen').style.width=`${Math.max(0,ga)}%`;
document.getElementById('healthRed').style.width=`${Math.max(0,ra)}%`;
}

function checkWin(){
const ga=tanks.filter(t=>t.team==='green'&&t.health>0).length,ra=tanks.filter(t=>t.team==='red'&&t.health>0).length;
if(ga===0){showModal('🤖 INIMIGOS VENCEU!','Seu esquadrão foi derrotado.',false);return true;}
if(ra===0){const il=currentStage>=maxStages;showModal(il?'🏆 VOCÊ ZEROU O JOGO!':`🎉 FASE ${currentStage} CONCLUÍDA!`,il?'Parabéns! Você venceu a Batalha Final!':'Inimigos destruídos! Próxima fase.',!il);return true;}
return false;
}

function showModal(t,d,sc){
document.getElementById('modalTitle').textContent=t;
document.getElementById('modalDesc').textContent=d;
document.getElementById('btnContinue').style.display=sc?'block':'none';
document.getElementById('gameModal').classList.add('active');
}

function nextStage(){
if(currentStage<maxStages)currentStage++;
document.getElementById('gameModal').classList.remove('active');
initStage();updateHealthBars();isShooting=false;projectile=null;
document.getElementById('turnIndicator').textContent='🟢 SUA VEZ — [🛈 Mover: 4 / 6 | Mira: 2 / 8 | Força: 1 / 3 | Atirar: 5 | Munição: 🔴 / 🟢]';
}

function resetGame(fr=false){
if(fr){currentStage=1;for(let k in aiGlobalBrain.redTanks)delete aiGlobalBrain.redTanks[k];aiGlobalBrain.successfulShotsMemory=[];}
document.getElementById('gameModal').classList.remove('active');
initStage();updateHealthBars();isShooting=false;projectile=null;
document.getElementById('turnIndicator').textContent='🟢 SUA VEZ — [🛈 Mover: 4 / 6 | Mira: 2 / 8 | Força: 1 / 3 | Atirar: 5 | Munição: 🔴 / 🟢]';
}

function processControls(){
const a=tanks[currentTankIndex];
if(a&&a.isPlayer&&!isShooting){
if(moveDir!==0){
a.isMoving=true;
a.facing=moveDir>0?1:-1;
a.x=Math.max(10,Math.min(logicalWidth-25,a.x+moveDir*1.8));
updateTankY(a);
}else a.isMoving=false;

if(angleDir!==0){
a.angle+=angleDir*1.2;
a.angle=Math.max(0,Math.min(85,a.angle));
}

if(forceDir!==0){
a.power=Math.max(10,Math.min(100,a.power+forceDir*1.0));
document.getElementById('powerText').textContent=`${Math.floor(a.power)}%`;
}
}
}

function gameLoop(){
processControls();updatePhysicsObjects();updateAI();
ctx.clearRect(0,0,logicalWidth,logicalHeight);
updateProjectile();drawWorld();
requestAnimationFrame(gameLoop);
}

function setupContinuousButton(e,s,en){
e.addEventListener('pointerdown',ev=>{ev.preventDefault();s();});
e.addEventListener('pointerup',ev=>{if(ev)ev.preventDefault();en();});
e.addEventListener('pointerleave',ev=>{if(ev)ev.preventDefault();en();});
}

const moveLeftBtn=document.getElementById('moveLeftBtn');
const moveRightBtn=document.getElementById('moveRightBtn');
const forceMinusBtn=document.getElementById('forceMinusBtn');
const forcePlusBtn=document.getElementById('forcePlusBtn');
const anglePlusBtn=document.getElementById('anglePlusBtn');
const angleMinusBtn=document.getElementById('angleMinusBtn');
const fireBtn=document.getElementById('fireBtn');

setupContinuousButton(moveLeftBtn,()=>moveDir=-1,()=>moveDir=0);
setupContinuousButton(moveRightBtn,()=>moveDir=1,()=>moveDir=0);
setupContinuousButton(forceMinusBtn,()=>forceDir=-1,()=>forceDir=0);
setupContinuousButton(forcePlusBtn,()=>forceDir=1,()=>forceDir=0);
setupContinuousButton(anglePlusBtn,()=>angleDir=1,()=>angleDir=0);
setupContinuousButton(angleMinusBtn,()=>angleDir=-1,()=>angleDir=0);

fireBtn.addEventListener('pointerdown',e=>{
e.preventDefault();
const a=tanks[currentTankIndex];
if(a&&a.isPlayer&&!isShooting)fireProjectile();
});

function selectWeaponIndex(index){
const a=tanks[currentTankIndex];
if(a&&a.isPlayer){
selectedWeapon=index;
document.querySelectorAll('.ammo-btn').forEach((x,i)=>x.classList.toggle('active',i===selectedWeapon));
}
}

document.querySelectorAll('.ammo-btn').forEach(b=>{
b.addEventListener('click',()=>{
selectWeaponIndex(Number(b.dataset.weapon));
});
});

const keyState = {};

window.addEventListener('keydown', e => {
const k = e.key;
const code = e.code;
const keyCode = e.keyCode;

if (keyState[code || k]) return;
keyState[code || k] = true;

if (code === 'Digit4' || code === 'Numpad4' || keyCode === 52 || keyCode === 100 || k === 'ArrowLeft') {
moveDir = -1;
moveLeftBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit6' || code === 'Numpad6' || keyCode === 54 || keyCode === 102 || k === 'ArrowRight') {
moveDir = 1;
moveRightBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit2' || code === 'Numpad2' || keyCode === 50 || keyCode === 98 || k === 'ArrowUp') {
angleDir = 1;
anglePlusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit8' || code === 'Numpad8' || keyCode === 56 || keyCode === 104 || k === 'ArrowDown') {
angleDir = -1;
angleMinusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit1' || code === 'Numpad1' || keyCode === 49 || keyCode === 97 || k === 'a' || k === 'A') {
forceDir = -1;
forceMinusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit3' || code === 'Numpad3' || keyCode === 51 || keyCode === 99 || k === 's' || k === 'S') {
forceDir = 1;
forcePlusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit5' || code === 'Numpad5' || keyCode === 53 || keyCode === 101 || k === ' ' || k === 'Space' || k === 'Enter' || keyCode === 13 || keyCode === 29443 || keyCode === 10252) {
fireBtn.classList.add('active-key');
const a = tanks[currentTankIndex];
if (a && a.isPlayer && !isShooting) {
fireProjectile();
}
e.preventDefault();
}

if (k === 'Red' || k === 'PROG_RED' || k === 'red' || keyCode === 403 || keyCode === 82) {
selectWeaponIndex(0);
e.preventDefault();
}

if (k === 'Green' || k === 'PROG_GREEN' || k === 'green' || keyCode === 404 || keyCode === 71) {
selectWeaponIndex(1);
e.preventDefault();
}
});

window.addEventListener('keyup', e => {
const k = e.key;
const code = e.code;
const keyCode = e.keyCode;

delete keyState[code || k];

if (code === 'Digit4' || code === 'Numpad4' || keyCode === 52 || keyCode === 100 || k === 'ArrowLeft') {
if (moveDir === -1) moveDir = 0;
moveLeftBtn.classList.remove('active-key');
}

if (code === 'Digit6' || code === 'Numpad6' || keyCode === 54 || keyCode === 102 || k === 'ArrowRight') {
if (moveDir === 1) moveDir = 0;
moveRightBtn.classList.remove('active-key');
}

if (code === 'Digit2' || code === 'Numpad2' || keyCode === 50 || keyCode === 98 || k === 'ArrowUp') {
if (angleDir === 1) angleDir = 0;
anglePlusBtn.classList.remove('active-key');
}

if (code === 'Digit8' || code === 'Numpad8' || keyCode === 56 || keyCode === 104 || k === 'ArrowDown') {
if (angleDir === -1) angleDir = 0;
angleMinusBtn.classList.remove('active-key');
}

if (code === 'Digit1' || code === 'Numpad1' || keyCode === 49 || keyCode === 97 || k === 'a' || k === 'A') {
if (forceDir === -1) forceDir = 0;
forceMinusBtn.classList.remove('active-key');
}

if (code === 'Digit3' || code === 'Numpad3' || keyCode === 51 || keyCode === 99 || k === 's' || k === 'S') {
if (forceDir === 1) forceDir = 0;
forcePlusBtn.classList.remove('active-key');
}

if (code === 'Digit5' || code === 'Numpad5' || keyCode === 53 || keyCode === 101 || k === ' ' || k === 'Space' || k === 'Enter' || keyCode === 13 || keyCode === 29443 || keyCode === 10252) {
fireBtn.classList.remove('active-key');
}
});

resizeCanvas();initStage();gameLoop();
</script>
